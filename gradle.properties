#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6144M
kotlin.native.jvmArgs=-Xmx4096M
kotlin.mpp.enableCInteropCommonization=true

#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1536m
org.gradle.configuration-cache=true
org.gradle.caching=true

#iOS distribution: 'full' enables in-app YouTube extraction (trailers); 'appstore' disables it
nuvio.ios.distribution=full

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
